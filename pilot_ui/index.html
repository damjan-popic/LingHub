<!doctype html>
<html lang="__PILOT_LOCALE__" data-pilot-base="__PILOT_BASE__">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin">
  <title>klikai</title>
  <link rel="stylesheet" href="__PILOT_BASE__/assets/pilot.css">
  <script type="module" src="__PILOT_BASE__/assets/pilot.mjs"></script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip_main">Preskoči na vsebino / Salta al contenuto</a>
<header class="site-header">
  <div class="brand-group"><a href="__PILOT_BASE__/" class="wordmark" aria-label="klikai">klik<span>ai</span></a></div>
  <div class="header-actions"><button id="beta-logout" class="plain" type="button" data-i18n="logout" hidden></button><nav id="locale-nav" class="locales" data-i18n-aria="ui_language"><a href="__PILOT_BASE__/" lang="sl" hreflang="sl" data-locale="sl" aria-label="Slovenščina">SL</a><span aria-hidden="true">/</span><a href="__PILOT_BASE__/it/" lang="it" hreflang="it" data-locale="it" aria-label="Italiano">IT</a></nav><button id="account-button" class="icon-button" type="button" data-i18n-aria="account" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button></div>
</header>
<main id="main">
  <p id="public-release" class="release-label"></p>
  <div id="global-status" class="status" role="status" aria-live="polite"></div>
  <section id="login-view" class="login-card" hidden>
    <div class="small-rule" aria-hidden="true"></div><h1 data-i18n="welcome"></h1><p class="muted" data-i18n="login_intro"></p>
    <form id="login-form"><label for="username" data-i18n="username"></label><input id="username" name="username" autocomplete="username" maxlength="200" required>
      <label for="password" data-i18n="password"></label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><button id="password-visibility" class="plain" type="button" data-i18n="show_password"></button></div>
      <p id="login-error" class="error" role="alert"></p><button class="primary wide" type="submit" data-i18n="sign_in"></button>
    </form><p class="small muted" data-i18n="password_reset_help"></p>
  </section>
  <section id="password-view" class="login-card" hidden><h1 data-i18n="password_change"></h1><p id="password-notice" class="muted" data-i18n="password_required"></p>
    <form id="password-form"><label for="current-password" data-i18n="password_current"></label><input id="current-password" type="password" autocomplete="current-password" required maxlength="1024"><label for="new-password" data-i18n="password_new"></label><input id="new-password" type="password" autocomplete="new-password" required maxlength="1024"><label for="confirm-password" data-i18n="password_confirm"></label><input id="confirm-password" type="password" autocomplete="new-password" required maxlength="1024"><p id="password-error" class="error" role="alert"></p><button class="primary wide" type="submit" data-i18n="save"></button><button id="password-cancel" class="plain wide" type="button" data-i18n="cancel"></button></form>
  </section>
  <div id="app-view" hidden>
    <p id="beta-notice" class="beta-notice" hidden><span data-i18n="beta_notice"></span></p>
    <form id="question-form" class="composer"><label for="question" data-i18n="composer_label"></label><textarea id="question" name="question" rows="3" maxlength="5000" required spellcheck="false" data-i18n-placeholder="composer_placeholder"></textarea>
      <div class="composer-toolbar"><div class="composer-controls"><button type="button" class="plain options-button" id="options-toggle" aria-expanded="false" aria-controls="options" data-i18n="more_options"></button></div><button class="primary" id="ask-button" type="submit"><span data-i18n="ask"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div>
      <p id="deterministic-task-note" class="small muted" data-i18n="deterministic_task_note" hidden></p>

      <div id="clarification" class="composer-options" hidden><p id="clarification-message" role="status"></p><div id="focus-control" hidden><label for="focus" data-i18n="focus_label"></label><input id="focus" type="text" maxlength="512" spellcheck="false" autocomplete="off"><p class="small muted" data-i18n="focus_hint"></p></div></div>
      <div id="capacity-state" class="composer-options" hidden><p id="capacity-message" role="status"></p><button id="capacity-models" type="button" class="plain" data-i18n="choose_available_model"></button><button id="capacity-sources" type="button" class="plain" data-i18n="use_source_search"></button><button id="capacity-tools" type="button" class="plain" data-i18n="use_exact_tools"></button></div>
      <div id="options" class="composer-options" hidden><label for="model" data-i18n="model"></label><select id="model"><option value="auto" data-i18n="model_auto">Samodejno</option><option value="qwen" data-i18n="model_qwen">Qwen3.8-27B</option><option value="gemma" data-i18n="model_gemma">Gemma-4-31B-it</option></select><p id="model-availability" class="small muted" role="status"></p><label for="task" data-i18n="task_mode"></label><select id="task"><option value="reference" data-i18n="ask_mode"></option><option value="source_search" data-i18n="source_search"></option><option value="jezikovna_urgenca" data-i18n="jezikovna_urgenca"></option><option value="jezikovna_posta" data-i18n="jezikovna_posta"></option><option value="text_check" data-i18n="text_check"></option><option value="morphology" data-i18n="morphology"></option><option value="terminology" data-i18n="terminology"></option></select><div id="text-language-control" class="composer-options" hidden><label for="input-language" data-i18n="text_language"></label><select id="input-language"><option value="" data-i18n="select_text_language"></option><option value="sl">Slovenščina</option><option value="it">Italiano</option></select><p class="small muted" data-i18n="text_language_hint"></p></div><label for="answer-locale" data-i18n="language_new_answer"></label><select id="answer-locale"><option value="sl">Slovenščina</option><option value="it">Italiano</option></select><p class="small muted" data-i18n="all_relevant_sources"></p></div>
    </form>
    <div class="composer-foot"><span class="small muted shortcut" data-i18n="submit_hint"></span><div><button id="new-question" class="plain" type="button" data-i18n="new_question" hidden></button><button id="history-toggle" class="plain" type="button" data-i18n="history" aria-expanded="false" aria-controls="history"></button></div></div>
    <section id="history" class="subpanel" hidden><h2 data-i18n="history"></h2><p id="shared-history-note" class="small muted" data-i18n="shared_history_note" hidden></p><div id="history-list"></div></section>
    <div id="job-state" class="job-status" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span id="job-message"></span><button class="plain" type="button" id="cancel-job" data-i18n="cancel"></button><button class="plain" type="button" id="retry-job" data-i18n="retry" hidden></button></div>
    <section id="empty-state" class="empty-state"><div class="conversation-mark" aria-hidden="true">?</div><p data-i18n="start_hint"></p></section>
    <section id="answer-card" class="answer-card" hidden aria-labelledby="short-heading"><div class="answer-heading"><h1 id="short-heading"><span class="dot" aria-hidden="true"></span><span data-i18n="short_heading"></span></h1><button type="button" id="copy-answer" class="plain" data-i18n="copy"></button></div><p id="revision-notice" class="qualified-note" data-i18n="revision_notice" hidden></p><p id="answer-model" class="small muted"></p><p id="generation-notice" class="qualified-note" hidden></p><div id="short-answer" class="answer-prose" lang="sl"></div><div id="short-sources" class="source-row"></div><div id="short-feedback" class="feedback-bar"></div>
      <div class="answer-actions"><button type="button" class="expand-button" id="expand-button" aria-expanded="false" aria-controls="long-section"><span data-i18n="expand_long"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button type="button" class="plain" id="compare-button" data-i18n="compare"></button></div>
      <div id="locale-note" class="locale-note" hidden><span data-i18n="expanded_language"></span> <button class="plain" id="translate-answer" type="button" data-i18n="answer_in_selected_language"></button></div>
      <section id="long-section" class="long-section" hidden><h2 data-i18n="long_heading"></h2><p class="small muted" data-i18n="expanded_basis"></p><div id="long-status" class="status" role="status"></div><p id="long-model" class="small muted"></p><div id="long-answer" class="answer-prose"></div><div id="long-sources" class="source-row"></div><div id="long-feedback" class="feedback-bar"></div></section>
      <div id="answer-status" class="status" role="status" aria-live="polite"></div>
    </section>
    <section id="beta-explorer" class="source-explorer" hidden aria-labelledby="explorer-heading">
      <h2 id="explorer-heading"></h2><p id="explorer-note" class="small muted"></p>
      <div id="explorer-badges" class="explorer-badges" role="group" data-i18n-aria="beta_sources_heading"></div>
      <p id="explorer-status" class="status" role="status"></p><button id="explorer-retry" type="button" class="plain" data-i18n="retry" hidden></button>
      <section id="explorer-records" hidden aria-labelledby="explorer-source-heading"><h3 id="explorer-source-heading"></h3>
        <ul id="explorer-list" class="explorer-list"></ul><p id="explorer-page-status" class="small muted" role="status"></p>
        <div class="explorer-pagination"><button id="explorer-previous" type="button" class="plain" data-i18n="beta_previous_records" hidden></button><button id="explorer-next" type="button" class="secondary" data-i18n="beta_more_records" hidden></button></div>
      </section>
    </section>
    <section id="matches-panel" class="subpanel matches-panel" hidden aria-labelledby="matches-heading">
      <h2 id="matches-heading" data-i18n="relevant_matches"></h2>
      <p id="matches-summary" class="small muted"></p>
      <p id="retrieval-notice" class="qualified-note" hidden></p>
      <details id="retrieval-coverage"><summary data-i18n="retrieval_coverage"></summary><ul id="coverage-list"></ul></details>
      <div class="matches-controls"><label for="matches-source" data-i18n="filter_loaded_matches"></label><select id="matches-source"><option value="" data-i18n="all_loaded_sources"></option></select></div>
      <div id="matches-list"></div><p id="matches-status" class="status" role="status"></p>
      <button id="matches-more" type="button" class="secondary" data-i18n="more_returned_matches" hidden></button>
    </section>
    <section id="comparison" class="comparison-panel" hidden><div class="answer-heading"><h2 data-i18n="compare"></h2><button class="icon-button" type="button" id="comparison-close" data-i18n-aria="comparison_close">×</button></div><p class="small muted" id="blind-notice" data-i18n="blind_intro"></p><div id="comparison-status" class="status" role="status" aria-live="polite"></div><div class="comparison-tabs" role="tablist" data-i18n-aria="compare"><button role="tab" id="tab-a" aria-selected="true" aria-controls="side-a" type="button" data-i18n="answer_a"></button><button role="tab" id="tab-b" aria-selected="false" aria-controls="side-b" type="button" data-i18n="answer_b"></button></div><div class="comparison-pair"><article id="side-a" class="comparison-side" role="tabpanel" aria-labelledby="tab-a"><h3 id="side-a-title" data-i18n="answer_a"></h3><div id="side-a-answer" class="answer-prose"></div><div id="side-a-sources" class="source-row"></div></article><article id="side-b" class="comparison-side" role="tabpanel" aria-labelledby="tab-b"><h3 id="side-b-title" data-i18n="answer_b"></h3><div id="side-b-answer" class="answer-prose"></div><div id="side-b-sources" class="source-row"></div></article></div><div class="vote-row" id="comparison-votes"><button type="button" data-vote="A" data-i18n="prefer_a"></button><button type="button" data-vote="B" data-i18n="prefer_b"></button><button type="button" data-vote="equivalent" data-i18n="tie"></button><button type="button" data-vote="both_inadequate" data-i18n="both_bad"></button><button type="button" data-vote="cannot_judge" data-i18n="cannot_judge"></button></div><div class="answer-actions"><button type="button" id="comparison-expand" class="expand-button" data-i18n="comparison_long"></button><button type="button" id="comparison-reveal" class="plain" data-i18n="reveal_models" hidden></button></div></section>
    <p class="testing-note" data-i18n="testing_notice"></p><p class="experimental-note" data-i18n="experimental_notice"></p>
  </div>
</main>
<footer><div class="credits"><a href="https://www.jeziknaklik.it/" target="_blank" rel="noopener noreferrer">Jezik na klik</a><span>SLORI <span aria-hidden="true">·</span> <span data-i18n="institution_region"></span></span></div><div class="footer-links"><span data-i18n="about"></span><span data-i18n="notices"></span><span data-i18n="privacy"></span><button id="source-legend-open" type="button" data-i18n="source_legend" aria-haspopup="dialog" aria-controls="source-legend-dialog" hidden></button></div></footer>
<dialog id="source-dialog" class="source-dialog" aria-labelledby="source-title"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="source_detail"></span><h2 id="source-title"></h2></div><button class="icon-button" type="button" data-close="source-dialog" data-i18n-aria="source_close">×</button></div><div id="source-content"></div></dialog>
<dialog id="feedback-dialog" aria-labelledby="feedback-title"><div class="dialog-heading"><h2 id="feedback-title" data-i18n="mark_error"></h2><button class="icon-button" type="button" data-close="feedback-dialog" data-i18n-aria="close">×</button></div><p id="feedback-target" class="small muted"></p><blockquote id="feedback-selection" hidden></blockquote><form id="feedback-form"><fieldset id="beta-feedback-rating" hidden><legend data-i18n="beta_feedback_useful"></legend><label><input type="radio" name="feedback-rating" value="useful"><span data-i18n="useful"></span></label><label><input type="radio" name="feedback-rating" value="not_useful"><span data-i18n="not_useful"></span></label></fieldset><fieldset id="feedback-tags"><legend data-i18n="feedback_tags"></legend></fieldset><label for="feedback-comment" data-i18n="feedback_comment"></label><textarea id="feedback-comment" rows="3" maxlength="4000"></textarea><label for="feedback-correction" data-i18n="feedback_correction"></label><textarea id="feedback-correction" rows="2" maxlength="4000"></textarea><p id="feedback-status" class="status" role="status"></p><div class="dialog-actions"><button class="plain" type="button" data-close="feedback-dialog" data-i18n="cancel"></button><button class="primary" type="submit" data-i18n="feedback_save"></button></div></form></dialog>
<dialog id="compare-dialog" aria-labelledby="compare-title"><div class="dialog-heading"><h2 id="compare-title" data-i18n="comparison_choose"></h2><button type="button" class="icon-button" data-close="compare-dialog" data-i18n-aria="close">×</button></div><p class="muted" data-i18n="blind_intro"></p><div class="choice-stack"><button type="button" class="primary" id="start-blind" data-i18n="comparison_blind"></button><button type="button" class="secondary" id="start-named" data-i18n="comparison_named"></button></div></dialog>
<dialog id="account-dialog" aria-labelledby="account-title"><div class="dialog-heading"><h2 id="account-title" data-i18n="account"></h2><button class="icon-button" type="button" data-close="account-dialog" data-i18n-aria="close">×</button></div><p id="account-name" class="muted"></p><div class="choice-stack"><button type="button" class="secondary" id="account-password" data-i18n="password_change"></button><button type="button" class="secondary" id="account-history" data-i18n="history"></button><button type="button" class="secondary" id="account-admin" data-i18n="admin" hidden></button><button type="button" class="plain" id="logout-button" data-i18n="logout"></button></div></dialog>
<dialog id="admin-dialog" class="wide-dialog" aria-labelledby="admin-title"><div class="dialog-heading"><h2 id="admin-title" data-i18n="admin"></h2><button class="icon-button" type="button" data-close="admin-dialog" data-i18n-aria="close">×</button></div><nav class="admin-tabs"><button class="secondary" type="button" data-admin-tab="overview" data-i18n="admin_automation"></button><button class="secondary" type="button" data-admin-tab="feedback" data-i18n="admin_feedback"></button><button class="secondary" type="button" data-admin-tab="accounts" data-i18n="admin_accounts"></button></nav><div id="admin-content"></div><p id="admin-status" class="status" role="status"></p></dialog>
<dialog id="source-legend-dialog" aria-labelledby="source-legend-title"><div class="dialog-heading"><h2 id="source-legend-title" data-i18n="source_legend"></h2><button class="icon-button" type="button" data-close="source-legend-dialog" data-i18n-aria="close" autofocus>×</button></div><p class="small muted" data-i18n="source_legend_intro"></p><ul id="source-legend-list" class="source-legend-list"></ul></dialog>
</body></html>
